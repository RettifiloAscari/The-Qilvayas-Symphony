# Per-repository settings for the shared authoring tools.
#
# tools/check_columns.py, verify.sh and find_page.py are byte-identical between
# The Qilvayas Symphony and The King's Crusade. Everything that differs between
# the two repositories lives here, so a fix to a tool is a copy rather than a
# re-derivation.
#
# Shell syntax; sourced by verify.sh and parsed by check_columns.py.

# Generators whose document is rendered single-column (build.sh's SINGLE_COL_MATCH).
# Their tables get the full page width, so the column checker skips them.
# Named by generator file, because the generator name and the document name do
# not always match.
SINGLE_COLUMN_GENERATORS="refguide.js"

# Usable text width, in inches, of ONE column of the two-column body.
# A4 (11906 twips) less the template margins (864 + 1008) and the inter-column
# space (360), halved, less the cell margins: ((11906-864-1008-360)/2)/1440 - 0.06
COLUMN_WIDTH_IN="3.30"

# Documents that may be handed to a player. Scanned for DM material on every
# verify run. Paths relative to the repository root.
PLAYER_FACING="corpus/QS_Player_Guide.md corpus/QS_Players_Companion.md"

# Strings that must never appear in a player-facing document. Extended regex,
# case-insensitive for the marker group and literal for the campaign secrets.
LEAK_MARKERS="DM Only|DM note"
# Phrases that only a DM-facing document would use. Deliberately narrow: "the party"
# and "the module" read perfectly naturally in player prose ("the rest of the party"),
# and a scan that flags them is a scan people learn to ignore.
LEAK_MECHANICAL="the DM should|pacing budget|read-aloud|boxed text|Diverging Paths|Branch Ledger|DM-facing"
LEAK_SECRETS="Threnvos|Undercourt|Cold Door|binding site|Vosthren"
